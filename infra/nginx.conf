# Example reverse proxy for Dashora web assets + API.
# Pair with the runtime container (API on 3000) or docker-compose.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Prefer precompressed artifacts from `vite-plugin-compression2` when present.
  gzip_static on;

  map $sent_http_content_type $cache_control {
    default "no-cache";
    ~*text/html "no-cache";
  }

  server {
    listen 8080;
    server_name _;

    root /srv/dashora-web;
    index index.html;

    location /api/ {
      proxy_pass http://dashora:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }

    # Content-addressed Vite assets — cache forever.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control $cache_control;
      try_files $uri $uri/ /index.html;
    }
  }
}
