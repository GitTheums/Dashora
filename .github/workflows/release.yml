name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm exec biome ci --linter-enabled=false --organize-imports-enabled=false --assists-enabled=false .

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Coverage thresholds (critical packages)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  publish:
    name: Publish GHCR image and GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: quality
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse tag metadata
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          REF_NAME="${GITHUB_REF_NAME}"
          VERSION="${REF_NAME#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Ref '${REF_NAME}' is not a valid semver tag (expected vMAJOR.MINOR.PATCH...)." >&2
            exit 1
          fi
          IS_PRERELEASE=false
          if [[ "${VERSION}" == *-* ]]; then
            IS_PRERELEASE=true
          fi
          {
            echo "version=${VERSION}"
            echo "is_prerelease=${IS_PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gittheums/dashora
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.tag.outputs.is_prerelease == 'false' }}
            type=semver,pattern={{major}},enable=${{ steps.tag.outputs.is_prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.tag.outputs.is_prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Dashora
            org.opencontainers.image.description=Self-hosted personal dashboard
            org.opencontainers.image.url=https://github.com/GitTheums/Dashora
            org.opencontainers.image.source=https://github.com/GitTheums/Dashora
            org.opencontainers.image.documentation=https://github.com/GitTheums/Dashora/blob/main/docs/installation.md
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=Dashora

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/gittheums/dashora
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.tag.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.tag.outputs.is_prerelease == 'false' }}
          # Idempotent on safely rerun: updates the existing release for the tag when present.
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
