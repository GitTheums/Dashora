packages:
  - "apps/*"
  - "packages/*"

# drizzle-kit@0.31.x still declares unused @esbuild-kit/esm-loader, which pins
# esbuild ~0.18.20 (GHSA-67mh-4wv8-2f99). No stable drizzle-kit release drops it;
# force a patched esbuild on that leaf only. Remove when drizzle-kit ships without @esbuild-kit/*.
overrides:
  "@esbuild-kit/core-utils>esbuild": ">=0.25.0"

allowBuilds:
  "@biomejs/biome": true
  better-sqlite3: true
  esbuild: true

autoInstallPeers: true
minimumReleaseAgeExclude:
  - react-grid-layout@2.2.4
strictPeerDependencies: false
